name: SeismicX C backend
on:
  push:
    paths: ['native/**', 'models/**', 'ckpt/**', 'CMakeLists.txt', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'models/**', 'ckpt/**', 'CMakeLists.txt', '.github/workflows/native.yml']
jobs:
  c-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [ON, OFF]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/build --parallel 2
      - run: python native/tools/export.py --output native/models/pnsn-fp32.bin --precision fp32
      - run: python native/tools/export.py --output native/models/pnsn-int8.bin
      - run: python native/tools/export_unet.py --output native/models/china-unet-fp32.bin --precision fp32
      - run: python native/tools/export_unet.py --output native/models/china-unet-int8.bin
      - run: python native/tests/validate_unet.py --output native/reports/unet-ci-validation.json
      - run: python native/tests/validate.py
      - run: python native/tests/validate_batch.py
      - run: ctest --test-dir native/build --output-on-failure
